{{- if .Values.global.testPartnerEnabled }}
# TEST/DEMO ONLY. Onboards the committed test-partner public key (so the sanity
# suite + Postman walkthrough can call the signed Partner API) and mounts its
# private key into the sanity Job. Gated by global.testPartnerEnabled — never
# rendered for a production install.
#
# Partner public keys — becomes the Bridge's partner-keys Secret in the trial
# profile (same name the API mounts at global.g2pBridgePartnerKeysDir).
apiVersion: v1
kind: Secret
metadata:
  name: {{ tpl .Values.global.g2pBridgePartnerKeysSecret $ }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: test-partner
type: Opaque
stringData:
  {{- range .Values.testPartner.mnemonics }}
  PARTNER_{{ . }}.json: {{ printf "{\"keys\":[%s]}" $.Values.testPartner.publicJwk | quote }}
  {{- end }}
---
# Test-partner private key — mounted into the sanity Job so it can sign requests.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-test-partner-signing
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: test-partner
type: Opaque
stringData:
  test-partner.key.json: {{ .Values.testPartner.privateJwk | quote }}
---
# Outbound signing key — the worker signs its SPAR resolve requests with this so
# SPAR (which trusts the matching public key as PARTNER_G2P_BRIDGE) can verify
# them. Same TEST-ONLY key; the JWK's own kid (test-partner-2026) is used.
apiVersion: v1
kind: Secret
metadata:
  name: {{ tpl .Values.global.g2pBridgeSigningKeySecret $ }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: test-partner
type: Opaque
stringData:
  signing-key.json: {{ .Values.testPartner.privateJwk | quote }}
{{- end }}
