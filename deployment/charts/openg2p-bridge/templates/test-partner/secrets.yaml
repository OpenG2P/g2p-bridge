{{- if and (eq .Values.global.g2pBridgeCryptoBackend "local") .Values.global.testPartnerEnabled }}
# TEST/DEMO ONLY (gated by global.testPartnerEnabled + local backend). The sanity
# Job signs Partner API requests as the test partner using the committed DEMO
# keystore (files/test-partner.p12). This is DELIBERATELY independent of the
# Bridge's outbound signing key (global.g2pBridgeSigningKey) — so the sanity test
# keeps working even when production swaps in a different outbound .p12 (mode
# existing/inline). The matching public cert is seeded into partner_keys as
# PARTNER_TEST_SANITY / PARTNER_TRAINING (see global.testPartnerCertPem). Never
# rendered for a production install.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-test-partner-signing
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: test-partner
type: Opaque
data:
  test-partner.p12: {{ .Files.Get "files/test-partner.p12" | b64enc }}
{{- end }}
