{{- if and .Values.sanity.enabled .Values.sanity.viewer.enabled -}}
{{- $r := .Values.sanity.results -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-sanity-results
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: sanity
  # NOTE: deliberately NOT annotated helm.sh/resource-policy: keep — this is a
  # test-artifact volume, so it must be removed on uninstall (helm, Rancher, or
  # uninstall-bridge.sh) along with all other test data. A `helm upgrade` never
  # deletes a still-rendered PVC, so reports survive upgrades regardless.
spec:
  accessModes:
    - {{ $r.accessMode }}
  {{- if $r.storageClass }}
  storageClassName: {{ $r.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $r.size }}
{{- end }}
