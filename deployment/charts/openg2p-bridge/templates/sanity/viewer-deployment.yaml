{{- if and .Values.sanity.enabled .Values.sanity.viewer.enabled -}}
{{- $v := .Values.sanity.viewer -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-sanity-viewer
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: sanity-viewer
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      # Browse all runs (results/<prefix>_<timestamp>/report.html); click into one.
      location / {
        autoindex on;
        autoindex_localtime on;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-sanity-viewer
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: sanity-viewer
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "common.labels.matchLabels" (dict "customLabels" .Values.podLabels "context" $) | nindent 6 }}
      app.kubernetes.io/component: sanity-viewer
  template:
    metadata:
      labels: {{- include "common.labels.matchLabels" (dict "customLabels" .Values.podLabels "context" $) | nindent 8 }}
        app.kubernetes.io/component: sanity-viewer
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-sanity-results
            readOnly: true
        - name: nginx-conf
          configMap:
            name: {{ .Release.Name }}-sanity-viewer
      containers:
        - name: viewer
          image: "{{ $v.image.repository }}:{{ $v.image.tag }}"
          imagePullPolicy: {{ $v.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: results
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
{{- end }}
