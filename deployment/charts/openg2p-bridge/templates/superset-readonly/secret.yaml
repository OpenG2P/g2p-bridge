{{- if .Values.supersetReadOnly.enabled }}
{{- $name := tpl .Values.supersetReadOnly.secretName $ }}
{{- $key := .Values.supersetReadOnly.passwordKey }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: superset-readonly
  annotations:
    # Keep the password stable across upgrades AND uninstall/reinstall so an
    # already-configured Superset connection doesn't break.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key }}: {{ if $existing }}{{ index $existing.data $key }}{{ else }}{{ randAlphaNum 24 | b64enc }}{{ end }}
{{- end }}
