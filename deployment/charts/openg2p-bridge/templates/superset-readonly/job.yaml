{{- if .Values.supersetReadOnly.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-superset-ro-init
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: superset-readonly
  annotations:
    # Runs after postgres-init (DBs created) and on every upgrade (by then the
    # app has migrated, so the SELECT grants cover all tables).
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "20"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 2
  template:
    metadata:
      labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 8 }}
        app.kubernetes.io/component: superset-readonly
    spec:
      restartPolicy: Never
      containers:
        - name: grant
          image: "{{ .Values.supersetReadOnly.image.repository }}:{{ .Values.supersetReadOnly.image.tag }}"
          imagePullPolicy: {{ .Values.supersetReadOnly.image.pullPolicy }}
          env:
            - name: PGHOST
              value: {{ tpl .Values.global.postgresqlHost $ | quote }}
            - name: PGSUPERPASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.supersetReadOnly.superuserSecret }}
                  key: {{ .Values.supersetReadOnly.superuserPasswordKey }}
            - name: ROPASS
              valueFrom:
                secretKeyRef:
                  name: {{ tpl .Values.supersetReadOnly.secretName $ }}
                  key: {{ .Values.supersetReadOnly.passwordKey }}
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              ROLE="{{ .Values.supersetReadOnly.roleName }}"
              export PGPASSWORD="$PGSUPERPASS"
              echo "Ensuring read-only role $ROLE ..."
              psql -h "$PGHOST" -U postgres -d postgres -v ON_ERROR_STOP=1 -c "DO \$do\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='$ROLE') THEN CREATE ROLE $ROLE LOGIN PASSWORD '$ROPASS'; ELSE ALTER ROLE $ROLE LOGIN PASSWORD '$ROPASS'; END IF; END \$do\$;"
              for db in {{ range .Values.supersetReadOnly.databases }}{{ tpl . $ }} {{ end }}; do
                echo "Granting read-only on $db ..."
                if ! psql -h "$PGHOST" -U postgres -d postgres -c "GRANT CONNECT ON DATABASE \"$db\" TO $ROLE;"; then
                  echo "  (skipping $db — not present)"; continue
                fi
                # Wait for the app to migrate (tables to exist) so the grants below
                # actually cover them — the app creates its schema on startup, which
                # can be after this hook runs on a fresh install.
                for i in $(seq 1 24); do
                  n=$(psql -h "$PGHOST" -U postgres -d "$db" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'" 2>/dev/null || echo 0)
                  [ "${n:-0}" -gt 0 ] && break
                  echo "  waiting for $db tables ($i/24) ..."; sleep 5
                done
                psql -h "$PGHOST" -U postgres -d "$db" -c "GRANT USAGE ON SCHEMA public TO $ROLE; GRANT SELECT ON ALL TABLES IN SCHEMA public TO $ROLE;" || true
                # Future tables: set default privileges for EVERY role that owns
                # tables in public, plus the DB owner. On external Postgres the app
                # user that creates the tables is often NOT the database owner, so
                # granting only for the owner would miss them.
                psql -h "$PGHOST" -U postgres -d "$db" -c "DO \$do\$ DECLARE r text; BEGIN FOR r IN SELECT tableowner FROM pg_tables WHERE schemaname='public' UNION SELECT rolname FROM pg_roles WHERE oid=(SELECT datdba FROM pg_database WHERE datname=current_database()) LOOP EXECUTE format('ALTER DEFAULT PRIVILEGES FOR ROLE %I IN SCHEMA public GRANT SELECT ON TABLES TO $ROLE', r); END LOOP; END \$do\$;" || true
              done
              echo "Read-only role provisioned."
{{- end }}
