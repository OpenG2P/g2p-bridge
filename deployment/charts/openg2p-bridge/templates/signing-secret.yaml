{{- /*
Outbound signing key (.p12 + password) Secret for the Bridge → SPAR signature.
The Bridge always SIGNS its resolve calls with this local .p12 (independent of the
inbound-verify backend), so this is NOT gated on g2pBridgeCryptoBackend. Rendered
only when signing is on AND the key source is chart-managed:
  - mode "demo"   -> the bundled demo key (files/test-partner.p12) + demoPassword.
                     PUBLIC / TESTING ONLY.
  - mode "inline" -> built from g2pBridgeSigningKey.p12Base64 + password (Rancher form).
  - mode "existing" -> NOT rendered; you create/upload the Secret yourself
                       (Rancher → Storage → Secrets) and set secretName to it.
The worker mounts secretName at mountPath and reads the password via secretKeyRef.
*/ -}}
{{- $sk := .Values.global.g2pBridgeSigningKey -}}
{{- $signingOn := or .Values.global.g2pBridgeSparSignRequestsEnabled .Values.global.testPartnerEnabled -}}
{{- if and $signingOn (or (eq $sk.mode "demo") (eq $sk.mode "inline")) }}
{{- if and (eq $sk.mode "inline") (not $sk.p12Base64) }}
{{- fail "global.g2pBridgeSigningKey.mode is 'inline' but p12Base64 is empty — paste the base64 of your .p12, or use mode 'existing'/'demo'." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ tpl $sk.secretName $ }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
    app.kubernetes.io/component: signing-key
type: Opaque
data:
  {{- if eq $sk.mode "demo" }}
  # Bundled DEMO key — public, testing only. Use mode=existing/inline for production.
  {{ $sk.secretKey }}: {{ .Files.Get "files/test-partner.p12" | b64enc }}
  {{- else }}
  # Already base64 (a .p12 is binary; the form value is its base64 encoding).
  {{ $sk.secretKey }}: {{ $sk.p12Base64 }}
  {{- end }}
stringData:
  {{ $sk.passwordSecretKey }}: {{ ternary $sk.demoPassword $sk.password (eq $sk.mode "demo") | quote }}
{{- end }}
