global:
  # Environment segment that all ingress hostnames below are derived from. Leave
  # EMPTY to auto-pick the install namespace (`.Release.Namespace`) — the usual
  # case, so it is not asked in the Rancher form. Only set this to override the
  # hostname segment when it must differ from the Kubernetes namespace.
  namespace: ""

  postgresqlHost: commons-postgresql
  # Bridge DB naming modeled on NSR: DB/user derived from the release name
  # (dashes -> underscores so they're valid Postgres identifiers).
  bridgeDB: '{{ printf "%s" .Release.Name | replace "-" "_" }}'
  bridgeDBPort: 5432
  bridgeDBUser: '{{ printf "%s_user" .Release.Name | replace "-" "_" }}'
  # NOTE: '-db' suffix avoids colliding with the keycloak client secret, which
  # keycloak-init names after the clientId (g2p-bridge). NSR can use the bare
  # release name because its client isn't named after the release.
  bridgeDBSecret: '{{ .Release.Name }}-db'
  bridgeDBUserPasswordKey: '{{ .Release.Name }}-db-user'

  # Default name of Redis that is installed with this chart
  redisInstallationName: '{{ .Release.Name }}-redis-master'

  g2pBridgeHostname: 'g2p-bridge.{{ .Values.global.namespace | default .Release.Namespace }}.openg2p.org'
  benePortalHostname: 'g2p-bridge-bene-portal.{{ .Values.global.namespace | default .Release.Namespace }}.openg2p.org'

  # In-cluster base URL of the G2P Bridge API service (service-to-service calls,
  # e.g. the Example Bank uploading MT940 statements back to the Bridge).
  g2pBridgeApiBaseUrl: 'http://{{ .Release.Name }}-api'

  # Example Bank (bundled simulator). Toggle the whole simulator via exampleBank.enabled.
  exampleBankHostname: 'example-bank.{{ .Values.global.namespace | default .Release.Namespace }}.openg2p.org'
  # In-cluster URL the Bridge uses to reach the Example Bank API.
  g2pBridgeExampleBankBaseUrl: http://openg2p-g2p-bridge-example-bank-api
  g2pBrdidgeExampleBankCode: EXAMPLE-BANK

  # Keycloak is per-namespace (commons layer in this namespace), same as NSR.
  keycloakBaseUrl: 'https://keycloak.{{ .Values.global.namespace | default .Release.Namespace }}.openg2p.org'
  keycloakRealm: staff
  keycloakIssuerUrl: '{{ tpl .Values.global.keycloakBaseUrl $ }}/realms/{{ tpl .Values.global.keycloakRealm $ }}'

  g2pBridgeMapperBaseUrl: 'http://spar-openg2p-spar-mapper-api/api/mapper'

  # Celery: Bridge uses Redis DB 0; Example Bank uses DB 1 (separate brokers on same Redis).
  g2pBridgeQueue: g2p_bridge_queue
  g2pBridgeRedisDb: 0
  exampleBankQueue: example_bank_queue
  exampleBankRedisDb: 1

  # OIDC client created by keycloak-init (see keycloak-init.realms below).
  g2pBridgeAuthClientId: 'g2p-bridge'
  # K8s secret holding the client password — same name as the client id, since
  # keycloak-init stores the generated secret in a Secret named after the clientId.
  g2pBridgeAuthClientSecret: '{{ tpl .Values.global.g2pBridgeAuthClientId $ }}'
  # Key containing client password (keycloak-init uses "client_secret").
  g2pBridgeAuthClientSecretKey: 'client_secret'

  # Inbound partner signature verification (local, Keymanager-free). When true,
  # every Partner API request must carry a valid detached JWS in the "Signature"
  # header, verified in-process against the partner's public key. Partner keys are
  # mounted from a user-managed Secret (one JWKS file per partner, named
  # PARTNER_<MNEMONIC>.json). Off by default — turn on once partners are onboarded.
  g2pBridgeSignatureValidationEnabled: false
  # Directory the partner public keys are mounted at, and the Secret holding them.
  g2pBridgePartnerKeysDir: /etc/g2p-bridge/partner-keys
  g2pBridgePartnerKeysSecret: '{{ .Release.Name }}-partner-keys'
  # Comma-separated allowed JWS algorithms (asymmetric only; "none"/HMAC always
  # rejected). ES256 is the recommended baseline; EdDSA preferred where supported.
  g2pBridgeSignatureAllowedAlgorithms: "ES256,EdDSA,PS256,RS256"

  # Outbound request signing to SPAR (only needed when SPAR enforces signatures).
  # The Bridge signs each resolve request with its own private key, mounted from a
  # user-managed Secret; SPAR must hold the matching public key. Enabled per the
  # mapper-connectors SPAR_MAPPER_API_SIGN_ENABLED flag (off by default).
  g2pBridgeSigningKeyDir: /etc/g2p-bridge/signing-key
  g2pBridgeSigningKeySecret: '{{ .Release.Name }}-signing-key'
  g2pBridgeSigningKeyKid: ""
  g2pBridgeSigningAlgorithm: ES256

  # TEST/DEMO trial profile. When true (the default for the bundled trial
  # install), the chart onboards a well-known TEST-ONLY partner key (see the
  # testPartner block below) AND turns signature validation ON, so the bundled
  # sanity suite and the Postman walkthrough exercise the signed Partner API out
  # of the box. The test private key is committed in the repo, so this MUST be set
  # false for any real deployment (turn it off together with exampleBank).
  testPartnerEnabled: true

  PBMSDBHostname: commons-postgresql
  PBMSDB: pbms_db
  PBMSDBUser: pbms_db_user
  PBMSDBSecret: pbms
  PBMSDBUserPasswordKey: pbms_db_user

  registryDBHostname: commons-postgresql
  registryDB: registry_db
  registryDBUser: registry_db_user
  registryDBSecret: registry
  registryDBUserPasswordKey: registry_db_user

  # Example Bank database (created via postgres-init when exampleBank.enabled).
  exampleBankDB: example_bank_db
  exampleBankDBUser: bankuser
  exampleBankDBSecret: '{{ .Release.Name }}-example-bank'
  exampleBankDBUserPasswordKey: bankuser

  # SPAR mapper database (owned by the SPAR release; the bridge only reads it for
  # the analytics read-only role / dashboards). Override if SPAR's DB is named
  # differently in your environment.
  sparDB: spar

  # In-kind disbursements (geo targeting, warehouse + agency allocation) require
  # the Registry and PBMS databases. Leave false for pure digital cash transfer,
  # where neither Registry nor PBMS is needed.
  g2pBridgeInKindEnabled: false

  # Single source of truth for the sponsor/treasury account, used both by the
  # Bridge (digital-cash sponsor config, when g2pBridgeInKindEnabled is false)
  # and to seed that same account into the bundled Example Bank (see
  # seedTreasuryAccount below). Keyed by "<benefit_program_id>:<benefit_code_id>";
  # "default" applies to all.
  #   - sponsor_bank_code / program_account_* : consumed by the Bridge worker.
  #   - account_currency / available_balance / account_holder_name : used to
  #     create the matching account in the Example Bank.
  sponsorBankConfigurations:
    default:
      sponsor_bank_code: '{{ tpl .Values.global.g2pBrdidgeExampleBankCode $ }}'
      program_account_number: "SPONSOR0001"
      program_account_type: ""
      program_account_branch_code: ""
      account_currency: USD
      # Quoted so it renders as "100000000" (not 1e+08) in the env var.
      available_balance: "10000000"
      account_holder_name: Program Treasury

  # Seed the treasury/sponsor account (from sponsorBankConfigurations.default)
  # into the Example Bank on its migrate. Needed for the digital-cash demo
  # because the Example Bank has no account-creation API. No effect when the
  # Example Bank is not deployed.
  seedTreasuryAccount: true

# TEST/DEMO ONLY — gated by global.testPartnerEnabled. A committed, well-known
# keypair (mirrors test/keys/) onboarded so the sanity suite and the Postman
# walkthrough can sign Partner API requests in the trial install. The private key
# is public knowledge (it is in the repo), so this is NEVER safe in production —
# set global.testPartnerEnabled=false there. See test/keys/README.md.
testPartner:
  # Public key is onboarded under PARTNER_<MNEMONIC>.json for each mnemonic:
  # TEST_SANITY (sanity suite) and TRAINING (Postman walkthrough).
  mnemonics:
    - TEST_SANITY
    - TRAINING
  publicJwk: '{"crv":"P-256","x":"d4zoYTTSHJOmqUSMcqL8bkLDrHtRIDXKxHHf91rRrSo","y":"ena--_HuHYqMLROH2c7jViK1C6xUSTbmRXRhVx-suxI","kid":"test-partner-2026","alg":"ES256","use":"sig","kty":"EC"}'
  privateJwk: '{"crv":"P-256","x":"d4zoYTTSHJOmqUSMcqL8bkLDrHtRIDXKxHHf91rRrSo","y":"ena--_HuHYqMLROH2c7jViK1C6xUSTbmRXRhVx-suxI","d":"Mtjj07k1PYjRcs9asSnrCGBOkWVD0ARAFDfsxqERLLQ","kid":"test-partner-2026","alg":"ES256","use":"sig","kty":"EC"}'

postgres-init:
  enabled: true
  postgresql:
    host: '{{ .Values.global.postgresqlHost }}'
    port: 5432
    # Hard coding. Same as one defined under Odoo
    existingSecret: commons-postgresql
    existingSecretPostgresPasswordKey: postgres-password
  databases:
    - name: '{{ tpl .Values.global.bridgeDB $ }}'
      user: '{{ tpl .Values.global.bridgeDBUser $ }}'
      secret: '{{ tpl .Values.global.bridgeDBSecret $ }}'
      secretUserPasswordKey: '{{ tpl .Values.global.bridgeDBUserPasswordKey $ }}'
    # Example Bank DB (simulator only; pods gated by exampleBank.enabled below).
    - name: '{{ tpl .Values.global.exampleBankDB $ }}'
      user: '{{ tpl .Values.global.exampleBankDBUser $ }}'
      secret: '{{ tpl .Values.global.exampleBankDBSecret $ }}'
      secretUserPasswordKey: '{{ tpl .Values.global.exampleBankDBUserPasswordKey $ }}'

# ----------------------------- Superset analytics -----------------------------
# Optional: create a read-only Postgres role for the platform Superset to connect
# with, and publish its password in a Secret (the admin enters it once when
# importing the G2P Bridge dashboards). Disabled by default — enable in
# environments that run Superset and want the bridge dashboards. No coupling to
# Superset: this just exposes a read-only credential any BI tool could use.
supersetReadOnly:
  enabled: true
  roleName: superset_ro
  # Secret holding the generated read-only password (kept stable across upgrades).
  secretName: '{{ .Release.Name }}-superset-ro'
  passwordKey: password
  image:
    repository: jbergknoff/postgresql-client
    tag: latest
    pullPolicy: IfNotPresent
  # Databases to grant read-only SELECT on (all templated — no hardcoded release
  # name). example_bank_db / spar are tolerated if absent (the grant just warns).
  databases:
    - '{{ tpl .Values.global.bridgeDB $ }}'
    - '{{ tpl .Values.global.exampleBankDB $ }}'
    - '{{ tpl .Values.global.sparDB $ }}'
  # Postgres superuser secret (the same one postgres-init uses).
  superuserSecret: commons-postgresql
  superuserPasswordKey: postgres-password

g2pBridgeApi:
  enabled: true
  nameOverride: api
  hostname: '{{ tpl .Values.global.g2pBridgeHostname $ }}'

  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  updateStrategy:
    type: RollingUpdate
  serviceAccount:
    create: false
    name: ""
  image:
    repository: openg2p/openg2p-bridge-partner-api
    tag: "g2p-5209"
    pullPolicy: Always
  podSecurityContext:
    enabled: false
    fsGroup: 1001
  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: true

  openapiRootPath: /api/g2p-bridge

  service:
    type: ClusterIP
    port: 80
    externalTrafficPolicy: Cluster

  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: '{{ tpl .Values.g2pBridgeApi.hostname $ }}'
      gateway: "internal"
      # Route to this component's own Service ({release}-{nameOverride}).
      destination: '{{ .Release.Name }}-api'
      destinationPort: 80
      prefix: '{{ .Values.g2pBridgeApi.openapiRootPath }}/'
      rewriteUri: "/"
    gateway:
      enabled: false

  envVars:
    G2P_BRIDGE_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    G2P_BRIDGE_DB_DBNAME: '{{ tpl .Values.global.bridgeDB $ }}'
    G2P_BRIDGE_DB_PORT: '{{ .Values.global.bridgeDBPort }}'
    G2P_BRIDGE_DB_USERNAME: '{{ tpl .Values.global.bridgeDBUser $ }}'
    G2P_BRIDGE_PORT: '{{ .Values.containerPort }}'
    G2P_BRIDGE_OPENAPI_ROOT_PATH: '{{ .Values.openapiRootPath }}'

    # Inbound partner JWS signature verification (local, Keymanager-free). On when
    # explicitly enabled OR when the trial test partner is onboarded.
    G2P_BRIDGE_SIGNATURE_VALIDATION_ENABLED: '{{ or .Values.global.g2pBridgeSignatureValidationEnabled .Values.global.testPartnerEnabled }}'
    G2P_BRIDGE_PARTNER_KEYS_DIR: '{{ .Values.global.g2pBridgePartnerKeysDir }}'
    G2P_BRIDGE_SIGNATURE_ALLOWED_ALGORITHMS: '{{ .Values.global.g2pBridgeSignatureAllowedAlgorithms }}'
  envVarsFrom:
    G2P_BRIDGE_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.bridgeDBSecret $ }}'
        key: '{{ tpl .Values.global.bridgeDBUserPasswordKey $ }}'
  # Partner public keys for inbound signature verification, mounted (read-only)
  # from a user-managed Secret. optional:true lets the API start with the mount
  # absent (e.g. signature validation off / not yet onboarded).
  extraVolumes:
    - name: partner-keys
      secret:
        secretName: '{{ tpl .Values.global.g2pBridgePartnerKeysSecret $ }}'
        optional: true
  extraVolumeMounts:
    - name: partner-keys
      mountPath: '{{ .Values.global.g2pBridgePartnerKeysDir }}'
      readOnly: true

  startupProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  livenessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  postgresCheckerInit:
    enabled: true
    image:
      repository: jbergknoff/postgresql-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
    - 'sh'
    args:
    - '-c'
    - 'until pg_isready -U ${G2P_BRIDGE_DB_USERNAME} -h ${G2P_BRIDGE_DB_HOSTNAME} -p ${G2P_BRIDGE_DB_PORT:-5432} -d ${G2P_BRIDGE_DB_DBNAME:-bridgedb}; do sleep 3; done'
    containerSecurityContext:
      enabled: false
  containerPort: 8000

openg2pG2pBridgeBenePortalApi:
  enabled: true
  nameOverride: bene-portal-api
  hostname: '{{ tpl .Values.global.benePortalHostname $ }}'
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  updateStrategy:
    type: RollingUpdate
  serviceAccount:
    create: false
    name: ""
  image:
    repository: openg2p/openg2p-bridge-bene-portal-api
    tag: "g2p-5209"
    pullPolicy: Always
  podSecurityContext:
    enabled: false
    fsGroup: 1001
  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: true

  openapiRootPath: /api/bene-portal

  service:
    type: ClusterIP
    port: 80
    externalTrafficPolicy: Cluster

  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: '{{ tpl .Values.openg2pG2pBridgeBenePortalApi.hostname $ }}'
      gateway: "internal"
      # Route to this component's own Service ({release}-{nameOverride}).
      destination: '{{ .Release.Name }}-bene-portal-api'
      destinationPort: 80
      prefix: '{{ .Values.openg2pG2pBridgeBenePortalApi.openapiRootPath }}/'
      rewriteUri: "/"
    gateway:
      enabled: false
      host: '{{ tpl .Values.openg2pG2pBridgeBenePortalApi.hostname $ }}'
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: false
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""

  envVars:
    BRIDGE_BENE_PORTAL_API_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    BRIDGE_BENE_PORTAL_API_DB_DBNAME: '{{ tpl .Values.global.bridgeDB $ }}'
    BRIDGE_BENE_PORTAL_API_DB_PORT: '{{ .Values.global.bridgeDBPort }}'
    BRIDGE_BENE_PORTAL_API_DB_USERNAME: '{{ tpl .Values.global.bridgeDBUser $ }}'
  envVarsFrom:
    BRIDGE_BENE_PORTAL_API_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.bridgeDBSecret $ }}'
        key: '{{ tpl .Values.global.bridgeDBUserPasswordKey $ }}'

  startupProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  livenessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  postgresCheckerInit:
    enabled: true
    image:
      repository: jbergknoff/postgresql-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
    - 'sh'
    args:
    - '-c'
    - 'until pg_isready -U ${BRIDGE_BENE_PORTAL_API_DB_USERNAME} -h ${BRIDGE_BENE_PORTAL_API_DB_HOSTNAME} -p ${BRIDGE_BENE_PORTAL_API_DB_PORT:-5432} -d ${BRIDGE_BENE_PORTAL_API_DB_DBNAME:-bridgedb}; do sleep 3; done'
    containerSecurityContext:
      enabled: false
  containerPort: 8000

g2pBridgeCeleryBeatProducers:
  enabled: true
  nameOverride: celery-beat-producer
  replicaCount: 1
  # Wait for Redis before starting Celery. Without this, on a fresh install the
  # worker/beat can come up "ready" but wedged (connected to a still-initializing
  # broker, consuming nothing). Postgres readiness is handled by postgresCheckerInit.
  initContainers:
    - name: wait-for-redis
      image: busybox:1.36
      command: ['sh', '-c']
      args:
        - 'until nc -z {{ tpl .Values.global.redisInstallationName $ }} 6379; do echo "waiting for redis..."; sleep 3; done'
  image:
    repository: openg2p/openg2p-bridge-celery
    tag: "g2p-5209"
    pullPolicy: Always

  envVars:
    # Run the shared celery image as the beat producer.
    CELERY_APP: openg2p_g2p_bridge_celery_beat_producers.main.celery_app
    # Beat producer tasks use Celery default queue (celery); worker pod listens on g2pBridgeQueue only.
    CELERY_OPTS: worker --beat --loglevel=info --schedule=/tmp/celery-beat-schedule.db

    G2P_BRIDGE_CELERY_BEAT_CELERY_WORKER_TASK_QUEUE: '{{ tpl .Values.global.g2pBridgeQueue $ }}'

    # When false (digital cash), the in-kind beat tasks are not scheduled.
    G2P_BRIDGE_CELERY_BEAT_IN_KIND_ENABLED: '{{ .Values.global.g2pBridgeInKindEnabled }}'

    G2P_BRIDGE_CELERY_BEAT_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    G2P_BRIDGE_CELERY_BEAT_DB_DBNAME: '{{ tpl .Values.global.bridgeDB $ }}'
    G2P_BRIDGE_CELERY_BEAT_DB_PORT: '{{ .Values.global.bridgeDBPort }}'
    G2P_BRIDGE_CELERY_BEAT_DB_USERNAME: '{{ tpl .Values.global.bridgeDBUser $ }}'

    G2P_BRIDGE_CELERY_BEAT_CELERY_BROKER_URL: redis://{{ tpl .Values.global.redisInstallationName $ }}:6379/{{ .Values.global.g2pBridgeRedisDb }}
    G2P_BRIDGE_CELERY_BEAT_CELERY_BACKEND_URL: redis://{{ tpl .Values.global.redisInstallationName $ }}:6379/{{ .Values.global.g2pBridgeRedisDb }}

    # Beat tick interval (seconds) for each pipeline stage. Low values make the
    # async pipeline (and the e2e sanity run) advance quickly — good for dev/demo
    # environments. Raise these for production to shape DB/load.
    G2P_BRIDGE_CELERY_BEAT_MAPPER_RESOLVE_FREQUENCY: 5
    G2P_BRIDGE_CELERY_BEAT_FUNDS_AVAILABLE_CHECK_FREQUENCY: 5
    G2P_BRIDGE_CELERY_BEAT_FUNDS_BLOCKED_FREQUENCY: 5
    G2P_BRIDGE_CELERY_BEAT_FUNDS_DISBURSEMENT_FREQUENCY: 5
    G2P_BRIDGE_CELERY_BEAT_MT940_PROCESSOR_FREQUENCY: 5
    G2P_BRIDGE_CELERY_BEAT_GEO_RESOLUTION_FREQUENCY: 5
    G2P_BRIDGE_CELERY_BEAT_WAREHOUSE_ALLOCATION_FREQUENCY: 5
    G2P_BRIDGE_CELERY_BEAT_AGENCY_ALLOCATION_FREQUENCY: 5
    G2P_BRIDGE_CELERY_BEAT_WAREHOUSE_NOTIFICATION_FREQUENCY: 5
    G2P_BRIDGE_CELERY_BEAT_AGENCY_NOTIFICATION_FREQUENCY: 5
    G2P_BRIDGE_CELERY_BEAT_BENEFICIARY_NOTIFICATION_FREQUENCY: 5

    G2P_BRIDGE_CELERY_BEAT_NO_OF_TASKS_TO_PROCESS: 2
    G2P_BRIDGE_CELERY_BEAT_DISBURSEMENT_RETRY_THRESHOLD_MINUTES: 30
    G2P_BRIDGE_CELERY_BEAT_PROCESS_FUTURE_DISBURSEMENT_SCHEDULES: true
    G2P_BRIDGE_CELERY_BEAT_TASK_STALE_THRESHOLD_MINUTES: 30

  envVarsFrom:
    G2P_BRIDGE_CELERY_BEAT_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.bridgeDBSecret $ }}'
        key: '{{ tpl .Values.global.bridgeDBUserPasswordKey $ }}'

  postgresCheckerInit:
    enabled: true
    image:
      repository: jbergknoff/postgresql-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
    - 'sh'
    args:
    - '-c'
    - >-
      until pg_isready
      -U ${G2P_BRIDGE_CELERY_BEAT_DB_USERNAME}
      -h ${G2P_BRIDGE_CELERY_BEAT_DB_HOSTNAME}
      -p ${G2P_BRIDGE_CELERY_BEAT_DB_PORT:-5432}
      -d ${G2P_BRIDGE_CELERY_BEAT_DB_DBNAME:-bridgedb};
      do sleep 3;
      done
    containerSecurityContext:
      enabled: false

  serviceAccount:
    create: false
    name: ""

g2pBridgeCeleryWorkers:
  enabled: true
  nameOverride: celery-worker
  replicaCount: 1
  # Wait for Redis before starting Celery (see g2pBridgeCeleryBeatProducers).
  initContainers:
    - name: wait-for-redis
      image: busybox:1.36
      command: ['sh', '-c']
      args:
        - 'until nc -z {{ tpl .Values.global.redisInstallationName $ }} 6379; do echo "waiting for redis..."; sleep 3; done'
  image:
    repository: openg2p/openg2p-bridge-celery
    tag: "g2p-5209"
    pullPolicy: Always

  envVars:
    # Run the shared celery image as the worker.
    CELERY_APP: openg2p_g2p_bridge_celery_workers.main.celery_app
    CELERY_OPTS: 'worker -Q {{ tpl .Values.global.g2pBridgeQueue $ }} --loglevel=info'

    G2P_BRIDGE_CELERY_WORKERS_CELERY_TASK_QUEUE: '{{ tpl .Values.global.g2pBridgeQueue $ }}'

    # In-kind toggle. When false (digital cash), geo/warehouse/agency are not
    # initialized and the sponsor bank config below is used instead of PBMS.
    G2P_BRIDGE_CELERY_WORKERS_IN_KIND_ENABLED: '{{ .Values.global.g2pBridgeInKindEnabled }}'
    # Sponsor bank config for digital cash (JSON), sourced from values.
    # tpl-render the JSON so nested {{ }} values (e.g. sponsor_bank_code) are
    # evaluated; toJson alone would emit them as literal template strings.
    G2P_BRIDGE_CELERY_WORKERS_SPONSOR_BANK_CONFIGURATIONS: '{{ tpl (.Values.global.sponsorBankConfigurations | toJson) $ }}'

    G2P_BRIDGE_CELERY_WORKERS_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    G2P_BRIDGE_CELERY_WORKERS_DB_DBNAME: '{{ tpl .Values.global.bridgeDB $ }}'
    G2P_BRIDGE_CELERY_WORKERS_DB_PORT: '{{ .Values.global.bridgeDBPort }}'
    G2P_BRIDGE_CELERY_WORKERS_DB_USERNAME: '{{ tpl .Values.global.bridgeDBUser $ }}'
    G2P_BRIDGE_CELERY_WORKERS_CELERY_BROKER_URL: redis://{{ tpl .Values.global.redisInstallationName $ }}:6379/{{ .Values.global.g2pBridgeRedisDb }}
    G2P_BRIDGE_CELERY_WORKERS_CELERY_BACKEND_URL: redis://{{ tpl .Values.global.redisInstallationName $ }}:6379/{{ .Values.global.g2pBridgeRedisDb }}

    # Read by SPARMapperClient (extensions/mapper-connectors/config.py), not G2PCONNECT_*.
    G2P_BRIDGE_MAPPER_CONNECTORS_SPAR_MAPPER_URL: '{{ .Values.global.g2pBridgeMapperBaseUrl }}/mapper/resolve'
    G2P_BRIDGE_MAPPER_CONNECTORS_SPAR_MAPPER_API_SIGN_ENABLED: false
    # Local (Keymanager-free) signing of outbound SPAR requests. Used only when
    # SPAR_MAPPER_API_SIGN_ENABLED is true; key mounted from a Secret (see below).
    G2P_BRIDGE_MAPPER_CONNECTORS_SIGNING_KEY_PATH: '{{ .Values.global.g2pBridgeSigningKeyDir }}/signing-key.json'
    G2P_BRIDGE_MAPPER_CONNECTORS_SIGNING_KEY_KID: '{{ .Values.global.g2pBridgeSigningKeyKid }}'
    G2P_BRIDGE_MAPPER_CONNECTORS_SIGNING_ALGORITHM: '{{ .Values.global.g2pBridgeSigningAlgorithm }}'
    G2P_BRIDGE_MAPPER_CONNECTORS_SIGNING_ALLOWED_ALGORITHMS: '{{ .Values.global.g2pBridgeSignatureAllowedAlgorithms }}'
    G2P_BRIDGE_CELERY_WORKERS_MAPPER_REQUEST_SENDER_ID: openg2p-g2p-bridge

    G2P_BRIDGE_CELERY_WORKERS_DB_HOSTNAME_PBMS: "{{ tpl .Values.global.PBMSDBHostname $ }}"
    G2P_BRIDGE_CELERY_WORKERS_DB_DBNAME_PBMS: '{{ tpl .Values.global.PBMSDB $ }}'
    G2P_BRIDGE_CELERY_WORKERS_DB_PORT_PBMS: 5432
    G2P_BRIDGE_CELERY_WORKERS_DB_USERNAME_PBMS: '{{ tpl .Values.global.PBMSDBUser $ }}'

    G2PCONNECT_MAPPER_CLIENT_API_BASE_URL: '{{ .Values.global.g2pBridgeMapperBaseUrl }}'
    G2PCONNECT_MAPPER_LINK_CLIENT_API_SIGN_ENABLED: false
    G2PCONNECT_MAPPER_UPDATE_CLIENT_API_SIGN_ENABLED: false
    G2PCONNECT_MAPPER_RESOLVE_CLIENT_API_SIGN_ENABLED: false
    G2PCONNECT_MAPPER_UNLINK_CLIENT_API_SIGN_ENABLED: false

    # Bank connectors (read by ExampleBankConnector — see core/celery-workers/.env.example)
    G2P_BRIDGE_BANK_CONNECTORS_FUNDS_AVAILABLE_CHECK_URL_EXAMPLE_BANK: '{{ tpl .Values.global.g2pBridgeExampleBankBaseUrl $ }}/check_funds'
    G2P_BRIDGE_BANK_CONNECTORS_FUNDS_BLOCK_URL_EXAMPLE_BANK: '{{ tpl .Values.global.g2pBridgeExampleBankBaseUrl $ }}/block_funds'
    G2P_BRIDGE_BANK_CONNECTORS_FUNDS_DISBURSEMENT_URL_EXAMPLE_BANK: '{{ tpl .Values.global.g2pBridgeExampleBankBaseUrl $ }}/initiate_payment'
    G2P_BRIDGE_BANK_CONNECTORS_BANK_SIMULATOR_CODE: '{{ tpl .Values.global.g2pBrdidgeExampleBankCode $ }}'

    G2P_BRIDGE_CELERY_WORKERS_BANK_FA_DECONSTRUCT_STRATEGY: '^account_number:(?P<account_number>.*)\.branch_code:(?P<branch_code>.*)\.bank_code:(?P<bank_code>.*)\.mobile_number:(?P<mobile_number>.*)\.email_address:(?P<email_address>.*)\.fa_type:(?P<fa_type>.*)$'
    G2P_BRIDGE_CELERY_WORKERS_MOBILE_WALLET_DECONSTRUCT_STRATEGY: '^mobile_number:(?P<mobile_number>.*)\.wallet_provider_name:(?P<wallet_provider_name>.*)\.wallet_provider_code:(?P<wallet_provider_code>.*)\.fa_type:(?P<fa_type>.*)$'
    G2P_BRIDGE_CELERY_WORKERS_EMAIL_WALLET_DECONSTRUCT_STRATEGY: '^email_address:(?P<email_address>.*)\.wallet_provider_name:(?P<wallet_provider_name>.*)\.wallet_provider_code:(?P<wallet_provider_code>.*)\.fa_type:(?P<fa_type>.*)$'

    G2P_BRIDGE_AGENCY_ALLOCATOR_DB_USERNAME_PBMS: '{{ tpl .Values.global.PBMSDBUser $ }}'
    G2P_BRIDGE_AGENCY_ALLOCATOR_DB_HOSTNAME_PBMS: "{{ tpl .Values.global.PBMSDBHostname $ }}"
    G2P_BRIDGE_AGENCY_ALLOCATOR_DB_PORT_PBMS: 5432
    G2P_BRIDGE_AGENCY_ALLOCATOR_DB_DBNAME_PBMS: '{{ tpl .Values.global.PBMSDB $ }}'

    G2P_BRIDGE_WAREHOUSE_ALLOCATOR_DB_USERNAME_PBMS: '{{ tpl .Values.global.PBMSDBUser $ }}'
    G2P_BRIDGE_WAREHOUSE_ALLOCATOR_DB_HOSTNAME_PBMS: "{{ tpl .Values.global.PBMSDBHostname $ }}"
    G2P_BRIDGE_WAREHOUSE_ALLOCATOR_DB_PORT_PBMS: 5432
    G2P_BRIDGE_WAREHOUSE_ALLOCATOR_DB_DBNAME_PBMS: '{{ tpl .Values.global.PBMSDB $ }}'

    G2P_BRIDGE_GEO_RESOLVER_DB_USERNAME_REGISTRY: '{{ tpl .Values.global.registryDBUser $ }}'
    G2P_BRIDGE_GEO_RESOLVER_DB_HOSTNAME_REGISTRY: "{{ tpl .Values.global.registryDBHostname $ }}"
    G2P_BRIDGE_GEO_RESOLVER_DB_PORT_REGISTRY: 5432
    G2P_BRIDGE_GEO_RESOLVER_DB_DBNAME_REGISTRY: '{{ tpl .Values.global.registryDB $ }}'

    G2P_BRIDGE_MAPPER_CONNECTORS_DB_USERNAME_REGISTRY: '{{ tpl .Values.global.registryDBUser $ }}'
    G2P_BRIDGE_MAPPER_CONNECTORS_DB_HOSTNAME_REGISTRY: "{{ tpl .Values.global.registryDBHostname $ }}"
    G2P_BRIDGE_MAPPER_CONNECTORS_DB_PORT_REGISTRY: 5432
    G2P_BRIDGE_MAPPER_CONNECTORS_DB_DBNAME_REGISTRY:  '{{ tpl .Values.global.registryDB $ }}'

    G2P_BRIDGE_CELERY_WORKERS_SUPPRESS_NOTIFICATIONS: true

    G2P_BRIDGE_CELERY_WORKERS_AGENCY_ALLOCATION_MAX_ATTEMPTS: 3
    G2P_BRIDGE_CELERY_WORKERS_WAREHOUSE_ALLOCATION_MAX_ATTEMPTS: 3
    G2P_BRIDGE_CELERY_WORKERS_GEO_RESOLUTION_MAX_ATTEMPTS: 3
    G2P_BRIDGE_CELERY_WORKERS_MAPPER_RESOLUTION_MAX_ATTEMPTS: 3
    G2P_BRIDGE_CELERY_WORKERS_CHECK_FUNDS_WITH_BANK_MAX_ATTEMPTS: 3
    G2P_BRIDGE_CELERY_WORKERS_BLOCK_FUNDS_WITH_BANK_MAX_ATTEMPTS: 3
    G2P_BRIDGE_CELERY_WORKERS_DISBURSE_FUNDS_WITH_BANK_MAX_ATTEMPTS: 3
    G2P_BRIDGE_CELERY_WORKERS_MT940_PROCESSOR_MAX_ATTEMPTS: 3
    G2P_BRIDGE_CELERY_WORKERS_AGENCY_NOTIFICATION_MAX_ATTEMPTS: 3
    G2P_BRIDGE_CELERY_WORKERS_WAREHOUSE_NOTIFICATION_MAX_ATTEMPTS: 3
    G2P_BRIDGE_CELERY_WORKERS_BENEFICIARY_NOTIFICATION_MAX_ATTEMPTS: 3

  envVarsFrom:
    # Bridge DB password — always required (created by postgres-init).
    G2P_BRIDGE_CELERY_WORKERS_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.bridgeDBSecret $ }}'
        key: '{{ tpl .Values.global.bridgeDBUserPasswordKey $ }}'
    # The secrets below only exist when their feature is enabled — registry/PBMS
    # secrets with in-kind. optional:true lets the pod start without them in a
    # digital-only deployment.
    G2P_BRIDGE_CELERY_WORKERS_DB_PASSWORD_PBMS:
      secretKeyRef:
        name: '{{ tpl .Values.global.PBMSDBSecret $ }}'
        key: '{{ tpl .Values.global.PBMSDBUserPasswordKey $ }}'
        optional: true
    G2P_BRIDGE_WAREHOUSE_ALLOCATOR_DB_PASSWORD_PBMS:
      secretKeyRef:
        name: '{{ tpl .Values.global.PBMSDBSecret $ }}'
        key: '{{ tpl .Values.global.PBMSDBUserPasswordKey $ }}'
        optional: true
    G2P_BRIDGE_GEO_RESOLVER_DB_PASSWORD_REGISTRY:
      secretKeyRef:
        name: '{{ tpl .Values.global.registryDBSecret $ }}'
        key: '{{ tpl .Values.global.registryDBUserPasswordKey $ }}'
        optional: true
    G2P_BRIDGE_MAPPER_CONNECTORS_DB_PASSWORD_REGISTRY:
      secretKeyRef:
        name: '{{ tpl .Values.global.registryDBSecret $ }}'
        key: '{{ tpl .Values.global.registryDBUserPasswordKey $ }}'
        optional: true
    G2P_BRIDGE_AGENCY_ALLOCATOR_DB_PASSWORD_PBMS:
      secretKeyRef:
        name: '{{ tpl .Values.global.PBMSDBSecret $ }}'
        key: '{{ tpl .Values.global.PBMSDBUserPasswordKey $ }}'
        optional: true

  # Bridge signing key for outbound SPAR request signing, mounted (read-only)
  # from a user-managed Secret. optional:true lets the worker start with the
  # mount absent (the default, when SPAR signing is off).
  extraVolumes:
    - name: signing-key
      secret:
        secretName: '{{ tpl .Values.global.g2pBridgeSigningKeySecret $ }}'
        optional: true
  extraVolumeMounts:
    - name: signing-key
      mountPath: '{{ .Values.global.g2pBridgeSigningKeyDir }}'
      readOnly: true

  postgresCheckerInit:
    enabled: true
    image:
      repository: jbergknoff/postgresql-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
    - 'sh'
    args:
    - '-c'
    - >-
      until pg_isready
      -U ${G2P_BRIDGE_CELERY_WORKERS_DB_USERNAME}
      -h ${G2P_BRIDGE_CELERY_WORKERS_DB_HOSTNAME}
      -p ${G2P_BRIDGE_CELERY_WORKERS_DB_PORT:-5432}
      -d ${G2P_BRIDGE_CELERY_WORKERS_DB_DBNAME:-bridgedb};
      do sleep 3;
      done
    containerSecurityContext:
      enabled: false
  podSecurityContext:
    enabled: false
    fsGroup: 1001
  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: true
  serviceAccount:
    create: false
    name: ""

redis:
  enabled: true
  architecture: standalone
  master:
    persistence:
      enabled: false
  auth:
    enabled: false

# ---------------------------------------------------------------------------
# Keycloak init: previously created the G2P Bridge OIDC (client-credentials)
# client used solely to authenticate to Keymanager. The Bridge no longer depends
# on Keymanager — partner signatures are verified locally — so this OIDC client is
# no longer required and is DISABLED by default. The block is kept (off) for
# reference / reversibility; leaving it enabled would needlessly make
# `helm install` depend on Keycloak being reachable.
# ---------------------------------------------------------------------------
keycloak-init:
  enabled: false
  keycloak:
    # Internal URL to reach Keycloak within the namespace (commons layer).
    url: 'http://commons-keycloak:80'
    user: 'admin'
    password: ''
    # Keycloak chart's auto-created admin secret.
    existingSecret: 'commons-keycloak'
    existingSecretKey: 'admin-password'
  suffix: '{{ .Release.Namespace }}'
  realms:
    '{{ tpl .Values.global.keycloakRealm $ }}':
      clients:
        - clientId: '{{ tpl .Values.global.g2pBridgeAuthClientId $ }}'
          name: OpenG2P G2P Bridge
          # Confidential service client (client-credentials). keycloak-init
          # auto-generates the secret into a K8s Secret named after the clientId.
          publicClient: false
          # Host-scoped redirect URI (never a bare "*").
          redirectUris:
            - 'https://{{ tpl .Values.global.g2pBridgeHostname $ }}/*'

# ---------------------------------------------------------------------------
# Example Bank simulator (bundled). Set exampleBank.enabled=false to skip the
# entire simulator (api + celery beat/worker); Redis DB 1 is then unused.
# The example_bank_db entry in postgres-init still runs unless removed manually.
# ---------------------------------------------------------------------------
exampleBank:
  enabled: true

exampleBankApi:
  nameOverride: openg2p-g2p-bridge-example-bank-api
  fullnameOverride: openg2p-g2p-bridge-example-bank-api
  hostname: '{{ tpl .Values.global.exampleBankHostname $ }}'
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  updateStrategy:
    type: RollingUpdate
  serviceAccount:
    create: true
    name: ""
  image:
    repository: openg2p/openg2p-bridge-example-bank-api
    tag: "g2p-5209"
    pullPolicy: Always
  podSecurityContext:
    enabled: false
    fsGroup: 1001
  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: true

  openapiRootPath: /api/example-bank
  containerPort: 8000

  service:
    type: ClusterIP
    port: 80
    externalTrafficPolicy: Cluster

  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: '{{ tpl .Values.exampleBankApi.hostname $ }}'
      gateway: "internal"
      destination: openg2p-g2p-bridge-example-bank-api
      destinationPort: 80
      prefix: '{{ .Values.exampleBankApi.openapiRootPath }}/'
      rewriteUri: "/"
    gateway:
      enabled: false

  envVars:
    EXAMPLE_BANK_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    EXAMPLE_BANK_DB_DBNAME: '{{ tpl .Values.global.exampleBankDB $ }}'
    EXAMPLE_BANK_DB_PORT: 5432
    EXAMPLE_BANK_DB_USERNAME: '{{ tpl .Values.global.exampleBankDBUser $ }}'
    EXAMPLE_BANK_WORKER_TYPE: gunicorn
    EXAMPLE_BANK_HOST: 0.0.0.0
    EXAMPLE_BANK_PORT: '{{ .Values.containerPort }}'
    EXAMPLE_BANK_NO_OF_WORKERS: '1'
    EXAMPLE_BANK_OPENAPI_ROOT_PATH: '{{ .Values.openapiRootPath }}'
    EXAMPLE_BANK_CELERY_BROKER_URL: redis://{{ tpl .Values.global.redisInstallationName $ }}:6379/{{ .Values.global.exampleBankRedisDb }}
    EXAMPLE_BANK_CELERY_BACKEND_URL: redis://{{ tpl .Values.global.redisInstallationName $ }}:6379/{{ .Values.global.exampleBankRedisDb }}
    EXAMPLE_BANK_CELERY_WORKER_TASK_QUEUE: '{{ tpl .Values.global.exampleBankQueue $ }}'

    # Treasury/sponsor account seed — same account the Bridge debits for digital
    # cash (single source: global.sponsorBankConfigurations.default).
    EXAMPLE_BANK_SEED_TREASURY_ACCOUNT: '{{ .Values.global.seedTreasuryAccount }}'
    EXAMPLE_BANK_TREASURY_ACCOUNT_NUMBER: '{{ .Values.global.sponsorBankConfigurations.default.program_account_number }}'
    EXAMPLE_BANK_TREASURY_ACCOUNT_CURRENCY: '{{ .Values.global.sponsorBankConfigurations.default.account_currency }}'
    EXAMPLE_BANK_TREASURY_AVAILABLE_BALANCE: '{{ .Values.global.sponsorBankConfigurations.default.available_balance }}'
    EXAMPLE_BANK_TREASURY_ACCOUNT_HOLDER_NAME: '{{ .Values.global.sponsorBankConfigurations.default.account_holder_name }}'
  envVarsFrom:
    EXAMPLE_BANK_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.exampleBankDBSecret $ }}'
        key: '{{ tpl .Values.global.exampleBankDBUserPasswordKey $ }}'

  startupProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  livenessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  postgresCheckerInit:
    enabled: true
    image:
      repository: jbergknoff/postgresql-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
    - 'sh'
    args:
    - '-c'
    - 'until pg_isready -U ${EXAMPLE_BANK_DB_USERNAME} -h ${EXAMPLE_BANK_DB_HOSTNAME} -p ${EXAMPLE_BANK_DB_PORT:-5432} -d ${EXAMPLE_BANK_DB_DBNAME:-example_bank_db}; do sleep 3; done'
    containerSecurityContext:
      enabled: false

exampleBankCeleryBeat:
  nameOverride: example-bank-celery-beat-producer
  replicaCount: 1
  # Wait for Redis before starting Celery (see g2pBridgeCeleryBeatProducers).
  initContainers:
    - name: wait-for-redis
      image: busybox:1.36
      command: ['sh', '-c']
      args:
        - 'until nc -z {{ tpl .Values.global.redisInstallationName $ }} 6379; do echo "waiting for redis..."; sleep 3; done'
  serviceAccount:
    create: true
    name: ""
  image:
    repository: openg2p/openg2p-bridge-example-bank-celery-beat-producers
    tag: "g2p-5209"
    pullPolicy: Always
  podSecurityContext:
    enabled: false
    fsGroup: 1001
  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: true

  # Override the image CMD so celery beat writes its schedule DB to a writable
  # path. The app dir is read-only for the non-root user, so the default
  # relative 'celerybeat-schedule' file fails with "Permission denied"
  # (_gdbm.error) and the payment-processing beats never fire reliably.
  command:
    - celery
  args:
    - "-A"
    - main.celery_app
    - worker
    - "--loglevel=info"
    - "--beat"
    - "--schedule=/tmp/celery-beat-schedule.db"

  envVars:
    EXAMPLE_BANK_CELERY_CELERY_WORKER_TASK_QUEUE: '{{ tpl .Values.global.exampleBankQueue $ }}'
    EXAMPLE_BANK_CELERY_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    EXAMPLE_BANK_CELERY_DB_DBNAME: '{{ tpl .Values.global.exampleBankDB $ }}'
    EXAMPLE_BANK_CELERY_DB_PORT: 5432
    EXAMPLE_BANK_CELERY_DB_USERNAME: '{{ tpl .Values.global.exampleBankDBUser $ }}'
    EXAMPLE_BANK_CELERY_WORKER_TYPE: gunicorn
    EXAMPLE_BANK_CELERY_HOST: 0.0.0.0
    EXAMPLE_BANK_CELERY_PORT: '8000'
    EXAMPLE_BANK_CELERY_NO_OF_WORKERS: '1'
    EXAMPLE_BANK_CELERY_PROCESS_PAYMENT_FREQUENCY: 5
    EXAMPLE_BANK_CELERY_CELERY_BROKER_URL: redis://{{ tpl .Values.global.redisInstallationName $ }}:6379/{{ .Values.global.exampleBankRedisDb }}
    EXAMPLE_BANK_CELERY_CELERY_BACKEND_URL: redis://{{ tpl .Values.global.redisInstallationName $ }}:6379/{{ .Values.global.exampleBankRedisDb }}
  envVarsFrom:
    EXAMPLE_BANK_CELERY_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.exampleBankDBSecret $ }}'
        key: '{{ tpl .Values.global.exampleBankDBUserPasswordKey $ }}'

  postgresCheckerInit:
    enabled: true
    image:
      repository: jbergknoff/postgresql-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
    - 'sh'
    args:
    - '-c'
    - 'until pg_isready -U ${EXAMPLE_BANK_CELERY_DB_USERNAME} -h ${EXAMPLE_BANK_CELERY_DB_HOSTNAME} -p ${EXAMPLE_BANK_CELERY_DB_PORT:-5432} -d ${EXAMPLE_BANK_CELERY_DB_DBNAME:-example_bank_db}; do sleep 3; done'
    containerSecurityContext:
      enabled: false

exampleBankCeleryWorker:
  nameOverride: example-bank-celery-worker
  replicaCount: 1
  # Wait for Redis before starting Celery (see g2pBridgeCeleryBeatProducers).
  initContainers:
    - name: wait-for-redis
      image: busybox:1.36
      command: ['sh', '-c']
      args:
        - 'until nc -z {{ tpl .Values.global.redisInstallationName $ }} 6379; do echo "waiting for redis..."; sleep 3; done'
  command:
  - celery
  args:
  - -A
  - main.celery_app
  - worker
  - --loglevel=info
  - -Q
  - '{{ tpl .Values.global.exampleBankQueue $ }}'
  serviceAccount:
    create: true
    name: ""
  image:
    repository: openg2p/openg2p-bridge-example-bank-celery-workers
    tag: "g2p-5209"
    pullPolicy: Always
  podSecurityContext:
    enabled: false
    fsGroup: 1001
  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: true

  envVars:
    EXAMPLE_BANK_CELERY_CELERY_TASK_QUEUE: '{{ tpl .Values.global.exampleBankQueue $ }}'
    EXAMPLE_BANK_CELERY_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    EXAMPLE_BANK_CELERY_DB_DBNAME: '{{ tpl .Values.global.exampleBankDB $ }}'
    EXAMPLE_BANK_CELERY_DB_PORT: 5432
    EXAMPLE_BANK_CELERY_DB_USERNAME: '{{ tpl .Values.global.exampleBankDBUser $ }}'
    EXAMPLE_BANK_CELERY_WORKER_TYPE: gunicorn
    EXAMPLE_BANK_CELERY_HOST: 0.0.0.0
    EXAMPLE_BANK_CELERY_PORT: '8000'
    EXAMPLE_BANK_CELERY_NO_OF_WORKERS: '1'
    EXAMPLE_BANK_CELERY_PROCESS_PAYMENT_FREQUENCY: 5
    EXAMPLE_BANK_CELERY_CELERY_BROKER_URL: redis://{{ tpl .Values.global.redisInstallationName $ }}:6379/{{ .Values.global.exampleBankRedisDb }}
    EXAMPLE_BANK_CELERY_CELERY_BACKEND_URL: redis://{{ tpl .Values.global.redisInstallationName $ }}:6379/{{ .Values.global.exampleBankRedisDb }}
    # Example Bank uploads MT940 statements back to the Bridge API.
    EXAMPLE_BANK_CELERY_MT940_STATEMENT_CALLBACK_URL: '{{ tpl .Values.global.g2pBridgeApiBaseUrl $ }}/upload_mt940'
  envVarsFrom:
    EXAMPLE_BANK_CELERY_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.exampleBankDBSecret $ }}'
        key: '{{ tpl .Values.global.exampleBankDBUserPasswordKey $ }}'

  postgresCheckerInit:
    enabled: true
    image:
      repository: jbergknoff/postgresql-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
    - 'sh'
    args:
    - '-c'
    - 'until pg_isready -U ${EXAMPLE_BANK_CELERY_DB_USERNAME} -h ${EXAMPLE_BANK_CELERY_DB_HOSTNAME} -p ${EXAMPLE_BANK_CELERY_DB_PORT:-5432} -d ${EXAMPLE_BANK_CELERY_DB_DBNAME:-example_bank_db}; do sleep 3; done'
    containerSecurityContext:
      enabled: false

# -----------------------------------------------------------------------------
# Regression sanity suite (optional). Disabled by default — purely additive.
#   * a Helm test hook Job runs the suite on `helm test <release>` and can be
#     triggered by CD right after `helm upgrade`.
#   * results are written to a PVC; a small nginx "viewer" serves report.html.
# Auto (helm test) runs smoke + contract ONLY (creates no data). Set
# sanity.runE2e=true to include the data-creating e2e (test environments only).
# -----------------------------------------------------------------------------
sanity:
  # Enabled by default: runs L0 (smoke) + L1 (contract) on each install/upgrade.
  # These are read-only (no data created). L2 (e2e) is opt-in via runE2e below.
  enabled: true

  image:
    repository: openg2p/openg2p-bridge-sanity
    tag: g2p-5209
    pullPolicy: Always

  # L2 (end-to-end). false = L0 smoke + L1 contract only (no data). true = also
  # run L2 e2e, which CREATES test data and moves treasury funds. L0/L1 always run.
  runE2e: false
  # When false (default) the run NEVER fails the install/upgrade — read the report
  # for pass/fail. Set true only if you want a failing sanity run to fail the deploy.
  failOnError: false

  # Targets the suite hits — built ENTIRELY from already-defined chart values
  # (component hostnames + their openapiRootPath), so they track whatever the
  # APIs are actually served on. The pod resolves the public hostnames via DNS.
  bridgeBaseUrl: 'https://{{ tpl .Values.global.g2pBridgeHostname $ }}{{ .Values.g2pBridgeApi.openapiRootPath }}'
  benePortalBaseUrl: 'https://{{ tpl .Values.global.benePortalHostname $ }}{{ .Values.openg2pG2pBridgeBenePortalApi.openapiRootPath }}'
  exampleBankBaseUrl: 'https://{{ tpl .Values.global.exampleBankHostname $ }}{{ .Values.exampleBankApi.openapiRootPath }}'
  # SPAR mapper PUBLIC ingress (note the doubled /mapper). SPAR is a separate
  # deployment with no variable in this chart, so set it per environment
  # (surfaced in questions.yaml). Defaults to the conventional public host.
  sparMapperBaseUrl: 'https://spar.{{ .Values.global.namespace | default .Release.Namespace }}.openg2p.org/api/mapper/mapper'

  verifyTls: true
  # SPAR BANK strategy id whose construct matches the Bridge deconstruct (chart id 5).
  sparBankStrategyId: 5
  # Bene-portal tests off (enforces OIDC auth the suite does not yet do).
  benePortalEnabled: false

  # The test pod is a short-lived pytest run that is almost entirely I/O-bound
  # (it spends its time waiting on the Bridge's async pipeline), so it needs very
  # little CPU/RAM. The limit keeps headroom for pytest + html-report generation
  # so a run is never OOM-killed.
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits:   { cpu: 500m, memory: 256Mi }

  # Persistent results store. Shared by the test Job (write) and the viewer
  # (read). When the viewer is enabled this must be ReadWriteMany (both pods
  # mount it). With the viewer disabled, ReadWriteOnce is fine.
  results:
    storageClass: ""
    accessMode: ReadWriteMany
    size: 1Gi

  # Long-running nginx that serves the latest report at the hostname below.
  viewer:
    enabled: true
    image:
      repository: nginx
      tag: 1.27-alpine
      pullPolicy: IfNotPresent
    # Derived from the RELEASE name so two releases in one namespace (e.g.
    # g2p-bridge and g2p-bridge2) don't collide. Override per environment.
    hostname: '{{ .Release.Name }}-sanity.{{ .Values.global.namespace | default .Release.Namespace }}.openg2p.org'
    gateway: "internal"
    # Static nginx serving pre-generated report files — it streams from disk and
    # holds almost nothing in memory regardless of report size, so it runs in a
    # tiny footprint. Tune here if a very large report set needs more.
    resources:
      requests: { cpu: 5m, memory: 16Mi }
      limits:   { cpu: 50m, memory: 64Mi }
