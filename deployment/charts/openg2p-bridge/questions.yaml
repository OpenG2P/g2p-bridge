questions:
# ----------------------------- General -----------------------------
# NOTE: the hostname "namespace" segment is auto-derived from the install
# namespace (.Release.Namespace), so it is intentionally not asked here. Override
# the individual hostnames below if a host must differ from that default.
- variable: global.g2pBridgeHostname
  description: Hostname for the G2P Bridge partner API
  type: string
  label: G2P Bridge Hostname
  group: General
- variable: global.benePortalHostname
  description: Hostname for the G2P Bridge beneficiary portal API
  type: string
  label: Bene Portal Hostname
  group: General

# ------------------------ Disbursement mode -------------------------
- variable: global.g2pBridgeInKindEnabled
  description: Enable in-kind disbursements (geo targeting, warehouse & agency allocation). Requires the Registry and PBMS databases. Leave off for pure digital cash transfer.
  type: boolean
  default: false
  label: Enable In-kind Disbursements
  group: Disbursement
# --- Treasury / sponsor account (digital cash only; hidden when in-kind is on) ---
# The "default" sponsor entry below is the bundled-demo convenience. Its shipped
# values are DEMO DEFAULTS pointing at the Example Bank simulator; replace them
# with your real treasury account when using a real bank. (Production setups can
# configure the full per-program sponsorBankConfigurations map in values.yaml.)
- variable: global.seedTreasuryAccount
  description: Seed the treasury/sponsor account into the bundled Example Bank (it has no account-creation API), using the sponsor details below. Turn OFF when pointing at a real bank — the real bank already holds the account and its balance.
  type: boolean
  default: true
  label: Seed Example Bank Treasury Account
  group: Disbursement
  show_if: global.g2pBridgeInKindEnabled=false&&exampleBank.enabled=true
- variable: global.sponsorBankConfigurations.default.sponsor_bank_code
  description: "Bank code of the treasury/sponsor account the Bridge debits when disbursing digital cash. DEMO DEFAULT for the bundled Example Bank — set it to your real treasury bank code when using a real bank."
  type: string
  label: Sponsor Bank Code (demo default)
  group: Disbursement
  show_if: global.g2pBridgeInKindEnabled=false
- variable: global.sponsorBankConfigurations.default.program_account_number
  description: "Account number of the treasury/sponsor account the Bridge disburses from. DEMO DEFAULT for the bundled Example Bank — set it to your real treasury account number when using a real bank."
  type: string
  label: Sponsor Account Number (demo default)
  group: Disbursement
  show_if: global.g2pBridgeInKindEnabled=false
- variable: global.sponsorBankConfigurations.default.program_account_branch_code
  description: "Branch code of the treasury/sponsor account. DEMO DEFAULT for the bundled Example Bank — set it to your real treasury branch code when using a real bank."
  type: string
  label: Sponsor Account Branch Code (demo default)
  group: Disbursement
  show_if: global.g2pBridgeInKindEnabled=false
- variable: global.sponsorBankConfigurations.default.account_currency
  description: "Currency of the treasury/sponsor account (also used when seeding the Example Bank). DEMO DEFAULT — set it to your real treasury account currency when using a real bank."
  type: string
  label: Sponsor Account Currency (demo default)
  group: Disbursement
  show_if: global.g2pBridgeInKindEnabled=false
- variable: global.sponsorBankConfigurations.default.available_balance
  description: "SAMPLE / SEED DATA ONLY — the starting balance written to the bundled Example Bank treasury account when seeding. Ignored for a real bank (which already holds the funds); only applies when 'Seed Example Bank Treasury Account' is on."
  type: string
  label: Treasury Opening Balance (sample / seed only)
  group: Disbursement
  show_if: global.g2pBridgeInKindEnabled=false&&exampleBank.enabled=true&&global.seedTreasuryAccount=true

# --------------------------- Example Bank ---------------------------
- variable: exampleBank.enabled
  description: Deploy the bundled Example Bank simulator (api + celery beat/worker). Disable for production.
  type: boolean
  default: true
  label: Enable Example Bank
  group: Example Bank
- variable: global.exampleBankHostname
  description: Hostname under which the Example Bank API is accessed
  type: string
  label: Example Bank Hostname
  group: Example Bank
  show_if: exampleBank.enabled=true
- variable: global.g2pBridgeExampleBankBaseUrl
  description: In-cluster base URL the Bridge uses to reach the Example Bank API
  type: string
  label: Example Bank In-cluster URL
  group: Example Bank
  show_if: exampleBank.enabled=true
- variable: global.exampleBankDB
  description: Example Bank database name
  type: string
  label: Example Bank Database
  group: Example Bank
  show_if: exampleBank.enabled=true
- variable: global.exampleBankDBUser
  description: Example Bank database user
  type: string
  label: Example Bank Database User
  group: Example Bank
  show_if: exampleBank.enabled=true

# ----------------------------- Keycloak -----------------------------
- variable: global.keycloakBaseUrl
  description: Keycloak Base Url used in all components
  type: string
  label: Keycloak Base URL
  group: Keycloak
- variable: global.keycloakRealm
  description: Keycloak realm used by the components
  type: string
  label: Keycloak Realm
  group: Keycloak

# ------------------------ Partner Signatures ------------------------
# The Bridge verifies and signs partner requests in-process (local JWS, RS256).
# Onboard partner certs under "Partner Certs" / values.
- variable: global.g2pBridgeSignatureValidationEnabled
  description: Verify a partner JWS signature on every Partner API request (partners must be onboarded first via Partner Certs)
  type: boolean
  default: true
  label: Verify Partner Signatures
  group: Partner Signatures
- variable: global.g2pBridgeSparSignRequestsEnabled
  description: Sign outbound resolve requests to SPAR (turn on when SPAR enforces signature verification)
  type: boolean
  default: true
  label: Sign Requests to SPAR
  group: Partner Signatures
- variable: global.g2pBridgeSigningKey.mode
  description: "Source of the Bridge's outbound signing .p12 (local backend). demo = bundled demo key (testing only); existing = a Secret you uploaded via Storage → Secrets (production); inline = paste the .p12 base64 below."
  type: enum
  options:
    - demo
    - existing
    - inline
  default: demo
  label: Signing Key Source
  group: Partner Signatures
- variable: global.g2pBridgeSigningKey.secretName
  description: Name of the existing Secret holding the .p12 (key signing-key.p12) and its password (key password). Create it via Storage → Secrets with a file upload.
  type: string
  label: Existing Signing Secret
  group: Partner Signatures
  show_if: global.g2pBridgeSigningKey.mode=existing
- variable: global.g2pBridgeSigningKey.p12Base64
  description: Base64-encoded contents of your .p12 file (paste it here).
  type: multiline
  label: Signing .p12 (base64)
  group: Partner Signatures
  show_if: global.g2pBridgeSigningKey.mode=inline
- variable: global.g2pBridgeSigningKey.password
  description: Password that unlocks the .p12 keystore
  type: password
  label: Signing .p12 Password
  group: Partner Signatures
  show_if: global.g2pBridgeSigningKey.mode=inline
- variable: global.g2pBridgeSigningKeyKid
  description: Optional kid label for outbound signatures; leave blank to use the certificate's SHA-256 thumbprint.
  type: string
  label: Signing Key ID (kid)
  group: Partner Signatures
  show_if: global.g2pBridgeSigningKey.mode!=demo

# ------------------------------- SPAR -------------------------------
- variable: global.g2pBridgeMapperBaseUrl
  description: Base URL to reach SPAR Mapper
  type: string
  label: SPAR Mapper API Base URL
  group: SPAR

# ------------------------ Analytics / Dashboards --------------------
- variable: supersetReadOnly.enabled
  description: Create a read-only Postgres role + secret so the platform Superset can host the G2P Bridge dashboards. Leave off if you are not using Superset.
  type: boolean
  default: false
  label: Enable Superset Read-Only Role
  group: Analytics
- variable: global.sparDB
  description: SPAR mapper database name — used only to grant the analytics read-only role read access for the SPAR dashboard.
  type: string
  default: spar
  label: SPAR Database Name
  group: Analytics
  show_if: supersetReadOnly.enabled=true

# ------------------------- Bridge Database --------------------------
- variable: global.postgresqlHost
  description: PostgreSQL host shared by the Bridge databases
  type: string
  label: PostgreSQL Host
  group: Bridge Database
- variable: global.bridgeDB
  description: G2P Bridge database name
  type: string
  label: Bridge Database
  group: Bridge Database
- variable: global.bridgeDBUser
