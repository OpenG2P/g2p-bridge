questions:
# ----------------------------- General -----------------------------
- variable: global.namespace
  description: Namespace/environment segment used to derive all ingress hostnames (e.g. g2p-bridge.<namespace>.openg2p.org)
  type: string
  label: Namespace
  group: General
- variable: global.g2pBridgeHostname
  description: Hostname for the G2P Bridge partner API
  type: string
  label: G2P Bridge Hostname
  group: General
- variable: global.benePortalHostname
  description: Hostname for the G2P Bridge beneficiary portal API
  type: string
  label: Bene Portal Hostname
  group: General

# ------------------------ Disbursement mode -------------------------
- variable: global.g2pBridgeInKindEnabled
  description: Enable in-kind disbursements (geo targeting, warehouse & agency allocation). Requires the Registry and PBMS databases. Leave off for pure digital cash transfer.
  type: boolean
  default: false
  label: Enable In-kind Disbursements
  group: Disbursement
# --- Treasury / sponsor account (digital cash only; hidden when in-kind is on) ---
# The "default" sponsor entry below is the bundled-demo convenience. Its shipped
# values are DEMO DEFAULTS pointing at the Example Bank simulator; replace them
# with your real treasury account when using a real bank. (Production setups can
# configure the full per-program sponsorBankConfigurations map in values.yaml.)
- variable: global.seedTreasuryAccount
  description: Seed the treasury/sponsor account into the bundled Example Bank (it has no account-creation API), using the sponsor details below. Turn OFF when pointing at a real bank — the real bank already holds the account and its balance.
  type: boolean
  default: true
  label: Seed Example Bank Treasury Account
  group: Disbursement
  show_if: global.g2pBridgeInKindEnabled=false&&exampleBank.enabled=true
- variable: global.sponsorBankConfigurations.default.sponsor_bank_code
  description: "Bank code of the treasury/sponsor account the Bridge debits when disbursing digital cash. DEMO DEFAULT for the bundled Example Bank — set it to your real treasury bank code when using a real bank."
  type: string
  label: Sponsor Bank Code (demo default)
  group: Disbursement
  show_if: global.g2pBridgeInKindEnabled=false
- variable: global.sponsorBankConfigurations.default.program_account_number
  description: "Account number of the treasury/sponsor account the Bridge disburses from. DEMO DEFAULT for the bundled Example Bank — set it to your real treasury account number when using a real bank."
  type: string
  label: Sponsor Account Number (demo default)
  group: Disbursement
  show_if: global.g2pBridgeInKindEnabled=false
- variable: global.sponsorBankConfigurations.default.program_account_branch_code
  description: "Branch code of the treasury/sponsor account. DEMO DEFAULT for the bundled Example Bank — set it to your real treasury branch code when using a real bank."
  type: string
  label: Sponsor Account Branch Code (demo default)
  group: Disbursement
  show_if: global.g2pBridgeInKindEnabled=false
- variable: global.sponsorBankConfigurations.default.account_currency
  description: "Currency of the treasury/sponsor account (also used when seeding the Example Bank). DEMO DEFAULT — set it to your real treasury account currency when using a real bank."
  type: string
  label: Sponsor Account Currency (demo default)
  group: Disbursement
  show_if: global.g2pBridgeInKindEnabled=false
- variable: global.sponsorBankConfigurations.default.available_balance
  description: "SAMPLE / SEED DATA ONLY — the starting balance written to the bundled Example Bank treasury account when seeding. Ignored for a real bank (which already holds the funds); only applies when 'Seed Example Bank Treasury Account' is on."
  type: string
  label: Treasury Opening Balance (sample / seed only)
  group: Disbursement
  show_if: global.g2pBridgeInKindEnabled=false&&exampleBank.enabled=true&&global.seedTreasuryAccount=true

# --------------------------- Example Bank ---------------------------
- variable: exampleBank.enabled
  description: Deploy the bundled Example Bank simulator (api + celery beat/worker). Disable for production.
  type: boolean
  default: true
  label: Enable Example Bank
  group: Example Bank
- variable: global.exampleBankHostname
  description: Hostname under which the Example Bank API is accessed
  type: string
  label: Example Bank Hostname
  group: Example Bank
  show_if: exampleBank.enabled=true
- variable: global.g2pBridgeExampleBankBaseUrl
  description: In-cluster base URL the Bridge uses to reach the Example Bank API
  type: string
  label: Example Bank In-cluster URL
  group: Example Bank
  show_if: exampleBank.enabled=true
- variable: global.exampleBankDB
  description: Example Bank database name
  type: string
  label: Example Bank Database
  group: Example Bank
  show_if: exampleBank.enabled=true
- variable: global.exampleBankDBUser
  description: Example Bank database user
  type: string
  label: Example Bank Database User
  group: Example Bank
  show_if: exampleBank.enabled=true

# ----------------------------- Keycloak -----------------------------
- variable: keycloak-init.enabled
  description: Run keycloak-init to create the g2p-bridge OIDC client and its secret
  type: boolean
  default: true
  label: Create Keycloak Client
  group: Keycloak
- variable: global.keycloakBaseUrl
  description: Keycloak Base Url used in all components
  type: string
  label: Keycloak Base URL
  group: Keycloak
- variable: global.keycloakRealm
  description: Keycloak realm in which the Bridge client lives / is created
  type: string
  label: Keycloak Realm
  group: Keycloak
- variable: global.g2pBridgeAuthClientId
  description: OIDC Client ID
  type: string
  label: OIDC Client ID
  group: Keycloak
- variable: global.g2pBridgeAuthClientSecret
  description: OIDC client Kubernetes secret name
  type: string
  label: OIDC Client Secret Name
  group: Keycloak
- variable: global.g2pBridgeAuthClientSecretKey
  description: Key containing OIDC client password
  type: string
  label: OIDC Client Secret Key
  group: Keycloak

# ---------------------------- Keymanager ----------------------------
- variable: global.g2pBridgeKeymanagerAuthEnabled
  label: API Authentication Enabled
  description: Enables Keymanager API authentication.
  type: boolean
  group: Keymanager
- variable: global.g2pBridgeKeymanagerAppId
  description: Keymanager Application ID for G2P Bridge
  type: string
  label: Keymanager App ID
  group: Keymanager
- variable: global.keymanagerInstallationName
  description: In-cluster service name of Keymanager
  type: string
  label: Keymanager Service Name
  group: Keymanager

# ------------------------------- SPAR -------------------------------
- variable: global.g2pBridgeMapperBaseUrl
  description: Base URL to reach SPAR Mapper
  type: string
  label: SPAR Mapper API Base URL
  group: SPAR

# ------------------------ Analytics / Dashboards --------------------
- variable: supersetReadOnly.enabled
  description: Create a read-only Postgres role + secret so the platform Superset can host the G2P Bridge dashboards. Leave off if you are not using Superset.
  type: boolean
  default: false
  label: Enable Superset Read-Only Role
  group: Analytics
- variable: global.sparDB
  description: SPAR mapper database name — used only to grant the analytics read-only role read access for the SPAR dashboard.
  type: string
  default: spar
  label: SPAR Database Name
  group: Analytics
  show_if: supersetReadOnly.enabled=true

# ------------------------- Bridge Database --------------------------
- variable: global.postgresqlHost
  description: PostgreSQL host shared by the Bridge databases
  type: string
  label: PostgreSQL Host
  group: Bridge Database
- variable: global.bridgeDB
  description: G2P Bridge database name
  type: string
  label: Bridge Database
  group: Bridge Database
- variable: global.bridgeDBUser
  description: G2P Bridge database user
  type: string
  label: Bridge Database User
  group: Bridge Database
- variable: global.bridgeDBSecret
  description: G2P Bridge database user Kubernetes secret
  type: string
  label: Bridge Database User Secret
  group: Bridge Database
- variable: global.bridgeDBUserPasswordKey
  description: G2P Bridge database user password key
  type: string
  label: Bridge Database User Password Key
  group: Bridge Database

# -------------------------- Registry Database -----------------------
- variable: global.registryDBHostname
  description: Registry database hostname
  type: string
  label: Registry Database Hostname
  group: Registry
  show_if: global.g2pBridgeInKindEnabled=true
- variable: global.registryDB
  description: Registry Database
  type: string
  label: Registry Database
  group: Registry
  show_if: global.g2pBridgeInKindEnabled=true
- variable: global.registryDBUser
  description: Registry database user
  type: string
  label: Registry Database User
  group: Registry
  show_if: global.g2pBridgeInKindEnabled=true
- variable: global.registryDBSecret
  description: Registry database user Kubernetes secret
  type: string
  label: Registry Database User Secret
  group: Registry
  show_if: global.g2pBridgeInKindEnabled=true
- variable: global.registryDBUserPasswordKey
  description: Registry database user password key
  type: string
  label: Registry Database User Password Key
  group: Registry
  show_if: global.g2pBridgeInKindEnabled=true

# ----------------------------- PBMS Database ------------------------
- variable: global.PBMSDBHostname
  description: PBMS database hostname
  type: string
  label: PBMS Database Hostname
  group: PBMS
  show_if: global.g2pBridgeInKindEnabled=true
- variable: global.PBMSDB
  description: PBMS Database
  type: string
  label: PBMS Database
  group: PBMS
  show_if: global.g2pBridgeInKindEnabled=true
- variable: global.PBMSDBUser
  description: PBMS database user
  type: string
  label: PBMS Database User
  group: PBMS
  show_if: global.g2pBridgeInKindEnabled=true
- variable: global.PBMSDBSecret
  description: PBMS database user Kubernetes secret
  type: string
  label: PBMS Database User Secret
  group: PBMS
  show_if: global.g2pBridgeInKindEnabled=true
- variable: global.PBMSDBUserPasswordKey
  description: PBMS database user password key
  type: string
  label: PBMS Database User Password Key
  group: PBMS
  show_if: global.g2pBridgeInKindEnabled=true

# --------------------------- Infrastructure -------------------------
- variable: global.redisInstallationName
  description: In-cluster Redis service name (broker/backend for celery)
  type: string
  label: Redis Service Name
  group: Infrastructure

# ----------------------------- Sanity suite -------------------------
- variable: sanity.enabled
  description: Deploy the regression sanity suite (runs on each install/upgrade and serves an HTML report). Disabled by default.
  type: boolean
  default: false
  label: Enable Sanity Suite
  group: Sanity Suite
- variable: sanity.runE2e
  description: Include the full end-to-end flow (CREATES test data and moves treasury funds). Leave off for smoke+contract only. Test environments only.
  type: boolean
  default: false
  label: Run E2E (creates data)
  group: Sanity Suite
  show_if: sanity.enabled=true
- variable: sanity.failOnError
  description: Fail the install/upgrade if the sanity run fails. Off = the deploy is never affected; read the report for pass/fail.
  type: boolean
  default: false
  label: Fail Deploy On Sanity Failure
  group: Sanity Suite
  show_if: sanity.enabled=true
- variable: sanity.sparMapperBaseUrl
  description: SPAR Mapper partner API base URL (public ingress, note the doubled /mapper). Needed for the e2e seeding.
  type: string
  label: SPAR Mapper Base URL
  group: Sanity Suite
  show_if: sanity.enabled=true
- variable: sanity.viewer.enabled
  description: Serve the HTML report via a small nginx viewer (needs ReadWriteMany storage). If off, view results via pod logs.
  type: boolean
  default: true
  label: Enable Report Viewer
  group: Sanity Suite
  show_if: sanity.enabled=true
- variable: sanity.viewer.hostname
  description: Hostname for the sanity report viewer (defaults to <release>-sanity.<namespace>.<domain>).
  type: string
  label: Report Viewer Hostname
  group: Sanity Suite
  show_if: sanity.enabled=true
