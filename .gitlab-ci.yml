# g2p-bridge — build & publish on GitLab.
#
# Generated by openg2p/packaging ci/migrate/github-to-gitlab.sh, translated
# from this repo's GitHub caller. All versioning/build/publish logic lives
# centrally in openg2p/packaging@v1; this file only declares what THIS repo has.
#
#   images -> registry.gitlab.com/openg2p/g2p-bridge/g2p-bridge/<name>   (this project)
#   chart  -> openg2p/charts Helm registry                (shared catalogue)

include:
  - project: 'openg2p/packaging'
    ref: v1
    file: '/ci/gitlab/build-publish.yml'

variables:
  PACKAGING_REF: v1

  IMAGES: |
    [
      {
        "name": "partner-api",
        "dockerfile": "docker/g2p-bridge-apis/partner-api/Dockerfile",
        "pins": [
          {
            "arg": "FASTAPI_COMMON_REF",
            "repo": "https://github.com/openg2p/openg2p-fastapi-common",
            "ref": "develop"
          }
        ]
      },
      {
        "name": "bene-portal-api",
        "dockerfile": "docker/g2p-bridge-apis/beneportal-api/Dockerfile",
        "pins": [
          {
            "arg": "FASTAPI_COMMON_REF",
            "repo": "https://github.com/openg2p/openg2p-fastapi-common",
            "ref": "develop"
          }
        ]
      },
      {
        "name": "celery",
        "dockerfile": "docker/g2p-bridge-celery/Dockerfile",
        "pins": [
          {
            "arg": "FASTAPI_COMMON_REF",
            "repo": "https://github.com/openg2p/openg2p-fastapi-common",
            "ref": "develop"
          },
          {
            "arg": "SPAR_REF",
            "repo": "https://gitlab.com/openg2p/spar/spar",
            "ref": "develop"
          },
          {
            "arg": "G2P_BRIDGE_CONNECTORS_REF",
            "repo": "https://gitlab.com/openg2p/g2p-bridge/g2p-bridge-connectors",
            "ref": "1.2.0"
          }
        ]
      },
      {
        "name": "sanity",
        "dockerfile": "docker/g2p-bridge-sanity/Dockerfile"
      },
      {
        "name": "example-bank-api",
        "dockerfile": "example-bank/openg2p-example-bank-api/Dockerfile-git",
        "context": "example-bank",
        "pins": [
          {
            "arg": "FASTAPI_COMMON_REF",
            "repo": "https://github.com/openg2p/openg2p-fastapi-common",
            "ref": "1.1"
          }
        ]
      },
      {
        "name": "example-bank-celery-beat-producers",
        "dockerfile": "example-bank/openg2p-example-bank-celery-beat-producers/Dockerfile-git",
        "context": "example-bank",
        "pins": [
          {
            "arg": "FASTAPI_COMMON_REF",
            "repo": "https://github.com/openg2p/openg2p-fastapi-common",
            "ref": "1.1"
          }
        ]
      },
      {
        "name": "example-bank-celery-workers",
        "dockerfile": "example-bank/openg2p-example-bank-celery-workers/Dockerfile-git",
        "context": "example-bank",
        "pins": [
          {
            "arg": "FASTAPI_COMMON_REF",
            "repo": "https://github.com/openg2p/openg2p-fastapi-common",
            "ref": "1.1"
          }
        ]
      }
    ]

  CHART_PATH: deployment/charts/openg2p-bridge
  CHART_IMAGE_PATHS: '[".g2pBridgeApi.image.tag",".openg2pG2pBridgeBenePortalApi.image.tag",".g2pBridgeCeleryBeatProducers.image.tag",".g2pBridgeCeleryWorkers.image.tag",".exampleBankApi.image.tag",".exampleBankCeleryBeat.image.tag",".exampleBankCeleryWorker.image.tag",".sanity.image.tag"]'
  CHART_GITLAB_PROJECT: openg2p/charts
