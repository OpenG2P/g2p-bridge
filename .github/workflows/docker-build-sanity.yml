name: Build & Push G2P Bridge Sanity Docker

# Builds the regression sanity suite image from local in-repo source
# (test/sanity/). The image tag is the g2p-bridge repository ref.
on:
  push:
    branches:
      - "**"
    tags:
      - "**"
    paths:
      - 'test/sanity/**'
      - 'docker/g2p-bridge-sanity/**'
      - '.github/workflows/docker-build-sanity.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: openg2p/openg2p-g2p-bridge-sanity

jobs:
  docker-build:
    runs-on: ubuntu-latest
    name: Docker - sanity
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker_hub_actor }}
          password: ${{ secrets.docker_hub_token }}

      - name: Derive image tag from repo ref
        id: meta
        shell: bash
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push - sanity
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/g2p-bridge-sanity/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.authors=${{ github.repository_owner }}
            org.opencontainers.image.source=${{ github.repository }}@${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.description=G2P Bridge regression sanity suite
            org.openg2p.service.name=sanity
