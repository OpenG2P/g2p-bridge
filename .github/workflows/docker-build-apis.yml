name: Publish G2P Bridge API Dockers

# Builds the API images from the LOCAL in-repo source (core/). The image tag is
# the g2p-bridge repository ref (branch name or git tag).
#
# External OpenG2P libs are not in this repo; their version/ref is a
# workflow_dispatch input (shown with a default in the GitHub Actions UI, so it
# can be changed per run). Push/tag-triggered builds use the defaults below.
on:
  push:
    branches:
      - "**"
    tags:
      - "**"
    paths:
      - 'core/**'
      - 'docker/g2p-bridge-apis/**'
      - '.github/workflows/docker-build-apis.yml'
  workflow_dispatch:
    inputs:
      fastapi_common_ref:
        description: "openg2p-fastapi-common git ref (tag/branch)"
        default: "develop"
        type: string

jobs:
  docker-build:
    runs-on: ubuntu-latest
    name: Docker - ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: partner-api
            image: openg2p/openg2p-bridge-partner-api
            dockerfile: docker/g2p-bridge-apis/partner-api/Dockerfile
          - name: beneportal-api
            image: openg2p/openg2p-bridge-bene-portal-api
            dockerfile: docker/g2p-bridge-apis/beneportal-api/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker_hub_actor }}
          password: ${{ secrets.docker_hub_token }}

      - name: Derive image tag from repo ref
        id: meta
        shell: bash
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push - ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          build-args: |
            FASTAPI_COMMON_REF=${{ inputs.fastapi_common_ref || 'develop' }}
          tags: ${{ matrix.image }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.authors=${{ github.repository_owner }}
            org.opencontainers.image.source=${{ github.repository }}@${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=G2P Bridge API service image
            org.openg2p.service.name=${{ matrix.name }}
