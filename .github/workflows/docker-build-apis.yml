name: Build & Push G2P Bridge API Dockers

# Triggered only when API source, the API Dockerfiles, or this workflow change.
# The image tag is the g2p-bridge repository ref (branch name, e.g. develop, or
# git tag, e.g. v3.0.0) — so the docker tag always matches the repo tag.
#
# NOTE: the Dockerfiles under docker/ are copied as-is and
# still pip-install the services from GitHub via the G2P_REF build-arg, and the
# adapters/{version}.txt mechanism is preserved there for reference. Pointing
# those refs at this consolidated repo is part of the next (versions/refs) step.
on:
  push:
    branches:
      - "**"
    tags:
      - "**"
    paths:
      - 'core/**'
      - 'docker/g2p-bridge-apis/**'
      - '.github/workflows/docker-build-apis.yml'
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    name: Docker - ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: partner-api
            image: openg2p/openg2p-g2p-bridge-partner-api
            dockerfile: docker/g2p-bridge-apis/partner-api/Dockerfile
          - name: beneportal-api
            image: openg2p/openg2p-g2p-bridge-bene-portal-api
            dockerfile: docker/g2p-bridge-apis/beneportal-api/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker_hub_actor }}
          password: ${{ secrets.docker_hub_token }}

      - name: Derive image tag from repo ref
        id: meta
        shell: bash
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # Dockerfiles COPY adapters.requirements.txt; provide an empty one for now.
          # Wiring in the in-repo extensions/connectors is part of the next step.
          touch adapters.requirements.txt

      - name: Build and push - ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          build-args: |
            G2P_REF=${{ steps.meta.outputs.tag }}
          tags: ${{ matrix.image }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.authors=${{ github.repository_owner }}
            org.opencontainers.image.source=${{ github.repository }}@${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=G2P Bridge API service image
            org.openg2p.service.name=${{ matrix.name }}
