name: Test and coverage (core)

on:
  # NOTE: temporarily disabled on the develop branch.
  pull_request:
    branches-ignore:
      - develop
    paths:
      - 'core/**'
      - '.github/workflows/core-test.yml'
  push:
    branches-ignore:
      - develop
    paths:
      - 'core/**'
      - '.github/workflows/core-test.yml'
  workflow_dispatch:

concurrency:
  group: check-core-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: core

jobs:
  test:
    name: test with ${{ matrix.py }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        py:
          - "3.12"
        os:
          - ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup python for test ${{ matrix.py }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
      - name: Install system libs
        run: sudo apt-get update && sudo apt-get install -y libmagic1
      - name: Install test requirements
        run: |
          python -m pip install --upgrade pip
          # External libs (fastapi-common family, spar-models) from git.
          python -m pip install -r test-requirements.txt
          # In-repo libraries — models + the extensions the celery modules depend
          # on — must be installed BEFORE the celery modules (none are on PyPI).
          python -m pip install -e ./models
          python -m pip install \
            -e ../extensions/bank-connectors \
            -e ../extensions/geo-resolver \
            -e ../extensions/notification-connectors \
            -e ../extensions/agency-allocator \
            -e ../extensions/warehouse-allocator \
            -e ../extensions/mapper-connectors
          python -m pip install -e ./partner-api
          python -m pip install -e ./celery-beat-producers
          python -m pip install -e ./celery-workers
      - name: Run test suite
        run: |
          pytest --cov-branch --cov-report=term-missing --cov=openg2p_g2p_bridge_partner_api --cov=tests partner-api
          pytest --cov-branch --cov-report=term-missing --cov=openg2p_g2p_bridge_celery_beat_producers --cov=tests celery-beat-producers --cov-append
          pytest --cov-branch --cov-report=term-missing --cov=openg2p_g2p_bridge_celery_workers --cov=tests celery-workers --cov-append

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
