name: Publish G2P Bridge Helm chart

# Publishes the consolidated openg2p-bridge chart under deployment/charts/.
# Triggered when the charts (or this workflow) change; each changed chart is
# packaged and pushed.
on:
  push:
    branches-ignore:
      - main
    paths:
      - 'deployment/charts/**'
      - '.github/workflows/helm-publish.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit chart version (e.g. 1.0.0-g2p5466). Empty = derive from branch. Must be valid SemVer.'
        required: false
        type: string

env:
  CHARTS_DIR: deployment/charts

jobs:
  generate-charts:
    runs-on: ubuntu-latest
    env:
      SKIP: 'FALSE'
      RANCHER_CHART_FILTER: "openg2p.org/add-to-rancher"
    defaults:
      run:
        shell: bash
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Resolve chart version (branch-gated, with manual override)
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        # The published chart version is derived from the BRANCH NAME (overridden
        # at package time via `helm package --version`), with a unique run-number
        # suffix so Rancher / the GH-Pages CDN never serve a stale cached chart.
        BRANCH="${GITHUB_REF_NAME}"
        SUFFIX="${GITHUB_RUN_NUMBER}"          # monotonic + unique per run
        if [ -n "${INPUT_VERSION}" ]; then
          VER="${INPUT_VERSION}"               # manual override -> publish from any branch
        elif [ "$BRANCH" = "develop" ]; then
          VER="0.0.0-develop.${SUFFIX}"
        elif printf '%s' "$BRANCH" | grep -qE '^[0-9]+\.[0-9]+$'; then
          VER="${BRANCH}.0-develop.${SUFFIX}"  # active release line (Helm needs 3-part SemVer)
        elif printf '%s' "$BRANCH" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          VER="${BRANCH}"                       # frozen release, no suffix
        else
          echo "::warning::Branch '${BRANCH}' is not develop/N.N/N.N.N and no explicit version was given — skipping."
          echo "SKIP=TRUE" >> "$GITHUB_ENV"
          VER=""
        fi
        echo "CHART_VERSION=${VER}" >> "$GITHUB_ENV"
        echo "Resolved chart version for branch '${BRANCH}': ${VER:-<skipped>}"

    - name: Package charts
      if: env.SKIP != 'TRUE'
      run: |
        # Publish every chart that actually exists under deployment/charts/.
        # (Enumerating real chart dirs is robust to renames/deletions and to
        # tag pushes, unlike a changed-files diff.)
        RANCHER_CHARTS=()
        published=0
        for chartdir in "$CHARTS_DIR"/*/; do
          [ -f "${chartdir}Chart.yaml" ] || continue
          chartname=$(basename "${chartdir%/}")
          echo "Packaging chart: $chartname"
          helm dep up "$CHARTS_DIR/$chartname"
          helm package "$CHARTS_DIR/$chartname" --version "${CHART_VERSION}"
          published=$((published + 1))
          is_rancher_chart=$(grep "$RANCHER_CHART_FILTER" "$CHARTS_DIR/$chartname/Chart.yaml" || true)
          if [ -n "$is_rancher_chart" ]; then
            RANCHER_CHARTS+=("$chartname")
          fi
        done

        if [ "$published" -eq 0 ]; then
          echo "::warning::No charts found to publish";
          echo "SKIP=TRUE" >> $GITHUB_ENV
        fi
        echo "RANCHER_CHARTS=${RANCHER_CHARTS[@]}" >> $GITHUB_ENV

        shopt -s nocasematch
        if [[ '${{ github.repository_owner }}' != 'OpenG2P' ]]; then
          echo "SKIP=TRUE" >> $GITHUB_ENV
        fi
    - name: Upload tar as Artifact
      uses: actions/upload-artifact@v4
      with:
          name: charts
          path: ./*.tgz
      if: env.SKIP != 'TRUE'

    - name: Checkout branch for publishing
      uses: actions/checkout@v3
      with:
          repository: 'openg2p/openg2p-helm'
          ref: gh-pages
          token: ${{ secrets.OPENG2P_BOT_GITHUB_PAT }}
      if: env.SKIP != 'TRUE'

    - name: Download tar from Artifacts
      uses: actions/download-artifact@v4
      with:
          name: charts
          path: ./
      if: env.SKIP != 'TRUE'

    - name: Update index.yaml
      run: |
        helm repo index .
        for chartname in $RANCHER_CHARTS; do
          cp ${chartname}*.tgz rancher/
        done
        helm repo index --url ../ --merge rancher/index.yaml rancher
        for chartname in $RANCHER_CHARTS; do
          rm rancher/${chartname}*.tgz || true
        done
      if: env.SKIP != 'TRUE'

    - name: Commit Changes to repository
      uses: EndBug/add-and-commit@v7
      with:
        branch: gh-pages
        author_name: openg2pbot
        author_email: bot@openg2p.org
        default_author: user_info
        message: 'added g2p bridge helm charts for publish ${{ github.repository }}@${{ github.sha }}'
        add: './*.tgz ./index.yaml rancher/index.yaml'
      if: env.SKIP != 'TRUE'
