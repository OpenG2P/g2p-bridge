name: Build & Push G2P Bridge Celery Docker

# Single celery image for both roles (worker and beat producer); the role is
# selected at runtime via CELERY_APP / CELERY_OPTS, set by the Helm chart.
#
# Builds from the LOCAL in-repo source (core/ + extensions/). The image tag is
# the g2p-bridge repository ref (branch name or git tag).
#
# External OpenG2P libs are not in this repo; their version/ref is a
# workflow_dispatch input (shown with a default in the GitHub Actions UI, so it
# can be changed per run). openg2p-spar-models is only needed by the
# mapper-connectors extension. Push/tag-triggered builds use the defaults below.
on:
  push:
    branches:
      - "**"
    tags:
      - "**"
    paths:
      - 'core/**'
      - 'extensions/**'
      - 'docker/g2p-bridge-celery/**'
      - '.github/workflows/docker-build-celery.yml'
  workflow_dispatch:
    inputs:
      fastapi_common_ref:
        description: "openg2p-fastapi-common git ref (tag/branch)"
        default: "v1.1.5"
        type: string
      spar_ref:
        description: "openg2p-spar git ref (tag/branch) for openg2p-spar-models"
        default: "2.0"
        type: string

env:
  IMAGE_NAME: openg2p/openg2p-g2p-bridge-celery

jobs:
  docker-build:
    runs-on: ubuntu-latest
    name: Docker - celery
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker_hub_actor }}
          password: ${{ secrets.docker_hub_token }}

      - name: Derive image tag from repo ref
        id: meta
        shell: bash
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push - celery
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/g2p-bridge-celery/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            FASTAPI_COMMON_REF=${{ inputs.fastapi_common_ref || 'v1.1.5' }}
            SPAR_REF=${{ inputs.spar_ref || '2.0' }}
          tags: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.authors=${{ github.repository_owner }}
            org.opencontainers.image.source=${{ github.repository }}@${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.description=G2P Bridge Celery service image (worker or beat, selected at runtime)
            org.openg2p.service.name=celery
